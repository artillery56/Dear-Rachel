<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>母亲节快乐 ❤️</title>

<style>
body {
  margin: 0;
  font-family: "Microsoft YaHei";
  background: linear-gradient(135deg, #ffd6e0, #ffe9ec);
  overflow-x: hidden;
}

/* 🎁 礼物 */
#giftScreen {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.gift-text {
  font-size: 20px;
  color: #ff5c8a;
  text-align: center;
  margin-bottom: 20px;
}

.gift-box {
  width: 120px;
  height: 120px;
  position: relative;
  cursor: pointer;
  animation: bounce 1.5s infinite;
}

@keyframes bounce {
  50% { transform: translateY(-10px); }
}

.box {
  width: 100%;
  height: 80px;
  background: #ff8aa0;
  position: absolute;
  bottom: 0;
  border-radius: 10px;
}

.lid {
  width: 100%;
  height: 40px;
  background: #ff6f91;
  position: absolute;
  top: 0;
  border-radius: 10px;
  transform-origin: top;
  transition: 0.6s;
}

.open .lid {
  transform: rotateX(120deg);
}

/* ❤️ 爱心 */
.heart {
  position: fixed;
  font-size: 20px;
  animation: floatUp 2s forwards;
  z-index: 9999;
}

@keyframes floatUp {
  to {
    transform: translateY(-200px);
    opacity: 0;
  }
}

/* 💌 卡片 */
.card {
  max-width: 900px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
}

/* 📸 翻页效果 */
.slider {
  width: 90%;
  max-width: 700px;
  height: 400px;
  margin: 30px auto;
  position: relative;
  overflow: hidden;
  border-radius: 15px;
}

.slider-track {
  display: flex;
  transition: transform 1s ease;
}

.slider img {
  width: 100%;
  height: 400px;
  object-fit: contain; /* 不裁剪 */
  flex-shrink: 0;
  border-radius: 15px;
}

/* 🌸 飘花 */
.flower {
  position: fixed;
  top: -50px;
  font-size: 22px;
  animation: fall linear infinite;
  z-index: 9999;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
  }
}

h1 {
  text-align: center;
  color: #ff5c8a;
}

p {
  line-height: 1.8;
}
</style>
</head>

<body>

<!-- 🎁 -->
<div id="giftScreen">
  <div class="gift-text">
    Dear，母亲节快乐 ❤️<br>
    赶快打开我下方的礼物盒 🎁
  </div>

  <div class="gift-box" onclick="openGift(this)">
    <div class="lid"></div>
    <div class="box"></div>
  </div>
</div>

<!-- 💌 -->
<div class="card" id="mainContent" style="display:none;">
<h1>❤️ 母亲节快乐 ❤️</h1>

<p>
那两天的画面，我到现在都不敢多想。<br><br>
你被推进手术房的那一刻，我站在外面，什么都做不了。😔<br>
我连替你分担一点痛都不行，只能看着门关上……<br><br>
Edna那一次是这样，这一次Enya也是。<br><br>
你一个人承受着无法想象的疼，把我们的两个女儿带到这个世界。😖<br><br>
真正辛苦的人，是你。<br><br>
谢谢你，把Edna和Enya带来这个世界 ❤️<br>
谢谢你，一直撑着这个家 ❤️<br><br>
你不只是她们的妈妈，<br><br>
你也是我最心疼、最舍不得的人 ❤️❤️❤️
</p>

<!-- 📸 真·翻页 -->
<div class="slider">
  <div class="slider-track" id="track">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
    <img src="photo5.jpg">
  </div>
</div>

<audio id="music" loop>
  <source src="music.mp3">
</audio>

</div>

<script>

// 🎁 开礼物
function openGift(el){
  el.classList.add("open");

  for(let i=0;i<20;i++){
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.top="60vh";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),2000);
  }

  setTimeout(()=>{
    giftScreen.style.display="none";
    mainContent.style.display="block";
    music.play();
  },600);
}

// 📸 真翻页
let i=0;
const track=document.getElementById("track");
const total=5;

setInterval(()=>{
  i=(i+1)%total;
  track.style.transform=`translateX(-${i*100}%)`;
},3000);

// 🌸 飘花
function flower(){
  let f=document.createElement("div");
  f.className="flower";
  f.innerHTML=["🌸","💮","🌺"][Math.floor(Math.random()*3)];
  f.style.left=Math.random()*100+"vw";
  f.style.animationDuration=(3+Math.random()*5)+"s";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),8000);
}
setInterval(flower,400);

</script>

</body>
</html>
